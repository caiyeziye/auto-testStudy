<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>登录 - 自动化测试练习</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Microsoft YaHei", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-box {
      width: 360px;
      background: #fff;
      border-radius: 10px;
      padding: 32px 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
    }
    .login-box h2 {
      text-align: center;
      margin-bottom: 24px;
      color: #333;
    }
    .form-item {
      margin-bottom: 16px;
    }
    .form-item label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #555;
    }
    .form-item input[type="text"],
    .form-item input[type="password"] {
      width: 100%;
      height: 40px;
      padding: 0 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    .form-item input:focus {
      border-color: #667eea;
    }
    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #666;
      margin-bottom: 18px;
    }
    .options a { color: #667eea; text-decoration: none; }
    .btn-login {
      width: 100%;
      height: 42px;
      border: none;
      border-radius: 6px;
      background: #667eea;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
    .btn-login:hover { background: #5a6fd6; }
    .msg {
      margin-top: 14px;
      text-align: center;
      font-size: 14px;
      min-height: 20px;
    }
    .msg.error { color: #e74c3c; }
    .msg.success { color: #27ae60; }
  </style>
</head>
<body>

  <div class="login-box">
    <h2 id="title">用户登录</h2>

    <form id="loginForm" onsubmit="return false;">
      <div class="form-item">
        <label for="username">用户名</label>
        <input type="text" id="username" name="username" class="username"
               placeholder="请输入用户名" autocomplete="off">
      </div>

      <div class="form-item">
        <label for="password">密码</label>
        <input type="password" id="password" name="password" class="password"
               placeholder="请输入密码">
      </div>

      <div class="options">
        <label><input type="checkbox" id="remember"> 记住我</label>
        <a href="#" id="forgot">忘记密码？</a>
      </div>

      <button type="button" id="loginBtn" class="btn-login">登 录</button>

      <p id="msg" class="msg"></p>
    </form>
    <a href="https://www.baidu.com" id="search" class="search">百度一下，你就知道</a>
  </div>

  <script>
    const usernameEl = document.getElementById('username');
    const passwordEl = document.getElementById('password');
    const rememberEl = document.getElementById('remember');
    const msgEl      = document.getElementById('msg');
    const loginBtn   = document.getElementById('loginBtn');

    // 正确的测试账号
    const VALID_USER = 'admin';
    const VALID_PASS = '123456';

    function showMsg(text, type) {
      msgEl.textContent = text;
      msgEl.className = 'msg ' + type;
    }

    loginBtn.addEventListener('click', function () {
      const user = usernameEl.value.trim();
      const pass = passwordEl.value;

      // 1. 空值校验
      if (!user) {
        showMsg('用户名不能为空', 'error');
        return;
      }
      if (!pass) {
        showMsg('密码不能为空', 'error');
        return;
      }

      // 2. 账号密码校验
      if (user === VALID_USER && pass === VALID_PASS) {
        showMsg('登录成功，欢迎回来！', 'success');
        // 这里可以改成 window.location.href = 'home.html';
      } else {
        showMsg('用户名或密码错误', 'error');
      }
    });

    // 回车登录
    passwordEl.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') loginBtn.click();
    });
  </script>

</body>
</html>
